[project]
name = "sinaliza-analytics"
version = "0.1.0"
description = "Synthetic data generator and lakehouse export for the Sinaliza analytics pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "databricks-sdk==0.157.0",
  "faker==40.44.0",
  "numpy==2.4.6",
  "pandas==3.1.0",
  "psycopg[binary]==3.3.6",
  "pyarrow==26.0.0",
  "python-dotenv==1.2.4",
  "shapely==2.2.0",
]

[project.scripts]
sinaliza-generate = "generator.cli:main"
sinaliza-export = "export.cli:main"

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pandas-stubs==3.0.5.260914",
  "pytest==9.2.0",
  "pyyaml==6.0.3",
  "ruff==0.17.3",
  "sqlglot==30.25.0",
  "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "generator", "export"]

[tool.uv]
# Only versions published at least two days before they were chosen (supply-chain cooldown).
exclude-newer = "2026-10-29T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["common", "generator", "export", "tests"]

[[tool.mypy.overrides]]
module = ["shapely.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
