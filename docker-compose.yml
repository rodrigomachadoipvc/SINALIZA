# Sinaliza — local stack. Copy .env.example to .env first (see README).
# Only the gateway and the backoffice will publish ports for the app; the ports below for
# infrastructure are for local development tools (psql, RabbitMQ UI, storage console, Mailpit UI).

name: sinaliza

services:
  postgis:
    image: postgis/postgis:16-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:?}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      OCCURRENCE_DB_USER: ${OCCURRENCE_DB_USER:?}
      OCCURRENCE_DB_PASSWORD: ${OCCURRENCE_DB_PASSWORD:?}
      MUNICIPAL_DB_USER: ${MUNICIPAL_DB_USER:?}
      MUNICIPAL_DB_PASSWORD: ${MUNICIPAL_DB_PASSWORD:?}
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_UI_PORT:-15672}:15672'
    networks: [backend]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # S3-compatible object storage (RustFS, a drop-in for MinIO — see docs/DECISOES.md D05).
  storage:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?}
    volumes:
      - storage-data:/data
    ports:
      - '${S3_API_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    networks: [backend]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot job: creates the photos bucket (idempotent).
  storage-init:
    image: amazon/aws-cli:2.39.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-occurrence-photos}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null
        || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket "$$S3_BUCKET"
        && echo "bucket $$S3_BUCKET ready"
    depends_on:
      storage:
        condition: service_healthy
    networks: [backend]
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
    networks: [backend]
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------ services
  # Internal only: no published ports. The api-gateway (F6) is the single entry point.

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgis
      POSTGRES_PORT: '5432'
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:?}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: ${RABBITMQ_USER:?}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt-public.pem
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5173/redefinir-palavra-passe}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
    volumes:
      - ./infra/keys:/run/keys:ro
    depends_on:
      postgis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  municipal-service:
    build:
      context: .
      dockerfile: services/municipal-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgis
      POSTGRES_PORT: '5432'
      MUNICIPAL_DB_USER: ${MUNICIPAL_DB_USER:?}
      MUNICIPAL_DB_PASSWORD: ${MUNICIPAL_DB_PASSWORD:?}
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt-public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
    volumes:
      - ./infra/keys/jwt-public.pem:/run/keys/jwt-public.pem:ro
    depends_on:
      postgis:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    name: sinaliza-backend

volumes:
  postgis-data:
  rabbitmq-data:
  storage-data:
